
<table *ngIf="books !== null && books.length > 0" class="book-list">

    <tr *ngFor="let book of books" class="book-row clickable" (click)="viewBook(book.id)">

        <td class="book-icon-cell">
            <div class="book-icon">
                <i class="fa fa-book"></i>
            </div>
        </td>

        <td class="book-title-cell">
            <div class="book-title-pane">
                <div class="book-title">{{ book.title }}</div>
                <div class="book-authors">{{ book.authors }}</div>
            </div>
        </td>

        <td class="stats-cell">
            <div class="stats-pane small light" [class.highlight]="book.unreviewed_chapter_count > 0">
                <div class="stats-name">Chapters&nbsp;Reviewed</div>
                <div class="stats-value">
                    {{ book.chapters_count - book.unreviewed_chapter_count }}&nbsp;/&nbsp;{{ book.chapters_count }}
                </div>
            </div>
        </td>

        <td class="stats-cell">
            <div class="stats-pane small light" [class.highlight]="book.unreviewed_response_count > 0">
                <div class="stats-name">Unread&nbsp;Replies</div>
                <div class="stats-value">{{ book.unreviewed_response_count }}</div>
            </div>
        </td>

    </tr>
</table>

<div *ngIf="books === null || books.length === 0" class="notice no-books-pane">
    No assigned books found
</div>
