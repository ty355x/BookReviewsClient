<div *ngIf="isLoading">
    <app-loading></app-loading>
</div>

<div *ngIf="!isLoading && error">
    <app-page-error [error]="error"></app-page-error>
</div>

<div *ngIf="!isLoading && !error" class="pane">
    <div class="pane-section no-border">

        <div *ngIf="book !== null">
            <app-book-header [book]="book"></app-book-header>
        </div>

        <h1>Add Chapter</h1>

        <div class="form-field">
            <label>Title</label>
            <input class="textbox" style="width: 100%" [(ngModel)]="chapter.title" [disabled]="chapter.auto_title">
            <div>
                <button class="btn btn-flat" style="margin-left: -4px; margin-top: 4px;" (click)="toggleAutoTitle()">
                    <span *ngIf="chapter.auto_title" class="fa fa-check-square-o" style="margin-right: 6px;"></span>
                    <span *ngIf="!chapter.auto_title" class="fa fa-square-o" style="margin-right: 6px;"></span>
                    Automatically generate title
                </button>
            </div>
            <span *ngIf="formErrors['chapter.title']" class="form-field-error">{{ formErrors['chapter.title'] }}</span>
        </div>

        <div class="form-field">
            <label>Chapter Guidance</label>
            <textarea class="textarea" style="height: 8em; width: 100%" [(ngModel)]="content.guidance"></textarea>
            <span *ngIf="formErrors['content.guidance']" class="form-field-error">{{ formErrors['content.guidance'] }}</span>
        </div>

        <div class="form-field">
            <label>Content</label>
            <app-rich-text-editor #richTextEditor [allowTab]="true"></app-rich-text-editor>
            <span *ngIf="formErrors['content.content']" class="form-field-error">{{ formErrors['content.content'] }}</span>
        </div>

    </div>

    <div class="pane-section" style="padding-bottom: 0;">
        <button class="btn" (click)="save()">Save</button>
        <button class="btn" (click)="cancel()">Cancel</button>
    </div>
</div>
