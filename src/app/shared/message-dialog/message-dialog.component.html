<div class="dialog" style="min-width: 400px">
    <div class="dialog-title">
        <h1>{{ title }}</h1>
    </div>

    <div class="dialog-body">
        <div style="margin: 0 0 32px 0">{{ message }}</div>
    </div>

    <div class="dialog-footer">
        <button class="btn" (click)="close()">OK</button>
    </div>
</div>
