<div class="dialog" style="max-width: 600px;">
    <h1 class="dialog-title">
        <h1>{{ title }}</h1>
    </h1>

    <div class="dialog-body">
        {{ message }}
    </div>

    <div class="dialog-footer">
        <button class="btn" (click)="confirm()">OK</button>
        <button class="btn" (click)="close()">Cancel</button>
    </div>
</div>
