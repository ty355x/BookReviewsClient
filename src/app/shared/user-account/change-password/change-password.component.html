<div class="account-pane-outer no-header">
    <div class="account-pane">

        <h1>Change Password</h1>

        <app-page-error *ngIf="error" [error]="error"></app-page-error>

        <div class="form-field">
            <label>Password</label>
            <input type="password" class="textbox" [disabled]="isLoading" [(ngModel)]="password">
            <span *ngIf="formErrors.password" class="form-field-error">{{ formErrors.password }}</span>
        </div>
        <div class="form-field">
            <label>Confirm Password</label>
            <input type="password" class="textbox" [disabled]="isLoading" [(ngModel)]="confirmPassword">
            <span *ngIf="formErrors.confirmPassword" class="form-field-error">{{ formErrors.confirmPassword }}</span>
        </div>

        <div style="margin-top: 36px;">
            <button class="btn" [disabled]="isLoading" (click)="save()">Save</button>
            <button class="btn" [disabled]="isLoading" (click)="cancel()">Cancel</button>
        </div>
    </div>
</div>
