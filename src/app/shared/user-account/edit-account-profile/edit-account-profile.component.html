<div class="account-pane-outer no-header">
    <div class="account-pane">

        <h1>Edit Account Profile</h1>

        <app-page-error *ngIf="error" [error]="error"></app-page-error>

        <div class="form-field">
            <label>Name</label>
            <input class="textbox" [disabled]="isLoading" [(ngModel)]="formUser.name">
            <span *ngIf="formErrors.name" class="form-field-error">{{ formErrors.name }}</span>
        </div>

        <div class="form-field">
            <label>Email</label>
            <input class="textbox" [disabled]="isLoading" [(ngModel)]="formUser.email">
            <span *ngIf="formErrors.email" class="form-field-error">{{ formErrors.email }}</span>
        </div>

        <div class="form-field">
            <label>Reply Notification Emails</label>
            <select [(ngModel)]="formUser.setting_reply_notifications" class="select">
                <option value="disabled">Disabled</option>
                <option value="all">Enabled</option>
            </select>
        </div>

        <div style="margin-top: 36px;">
            <button class="btn" [disabled]="isLoading" (click)="save()">Save</button>
            <button class="btn" [disabled]="isLoading" (click)="cancel()">Cancel</button>
        </div>
    </div>

</div>
