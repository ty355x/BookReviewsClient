<div class="dialog">
    <div class="dialog-title">
        <h1>Edit Quick Replies</h1>
        <button class="btn btn-toolbar" (click)="addReply()" [disabled]="replies.length >= 3"><i class="fa fa-plus-square"></i>Add Reply</button>
    </div>

    <div class="dialog-body">

        <div class="reply-pane">
            <div *ngFor="let reply of replies" class="reply">

                <div *ngIf="!reply.edit">
                    <div class="reply-actions">
                        <button class="btn btn-flat btn-small-text" (click)="editReply(reply.id)"><i class="fa fa-edit"></i>Edit</button>
                        <button class="btn btn-flat btn-small-text" (click)="deleteReply(reply)"><i class="fa fa-trash"></i>Delete</button>
                    </div>
                    <div class="reply-content">
                        <app-rich-text [content]="reply.reply"></app-rich-text>
                    </div>
                </div>

                <div *ngIf="reply.edit">
                    <div class="reply-actions">
                        <button class="btn btn-flat btn-small-text" (click)="saveReply(reply)"><i class="fa fa-save"></i>Save</button>
                        <button class="btn btn-flat btn-small-text" (click)="finishEditReply()"><i class="fa fa-ban"></i>Cancel</button>
                    </div>
                    <div class="reply-content">
                        <app-rich-text-editor #replyEditor [size]="'small'"></app-rich-text-editor>
                    </div>
                </div>

            </div>
        </div>

        <p *ngIf="replies.length === 0">
            No quick replies defined
        </p>

    </div>

    <div class="dialog-footer">
        <button class="btn" (click)="close()">Close</button>
    </div>
</div>
