<div class="page-wrapper">
    <div class="pane" style="width: 340px">

        <div *ngIf="showSuccessMessage">
            <h1>Email Sent</h1>
            <p style="margin: 24px 0">We have sent a password reset link to the specified email address</p>
            <button class="btn btn-flat" (click)="backToLogin()">
                <i class="fa fa-sign-in"></i>Back to Login Page
            </button>
        </div>

        <div *ngIf="!showSuccessMessage">

            <h1 style="margin-bottom: 0;">Reset Password</h1>

            <div style="margin-top: 24px;">Enter your email address. We'll send you a link to reset your password.</div>

            <form class="form" style="margin-top: 24px;">

                <div class="form-field">
                    <label>Email</label>
                    <input id="email" name="email" type="text" class="textbox" [(ngModel)]="email" [disabled]="isLoading">
                </div>

                <div *ngIf="error" class="form-error" style="margin-bottom: -8px;">
                    {{ error }}
                </div>

                <div class="form-footer" style="margin-top: 32px;">
                    <button type="submit" class="btn btn-form wide" (click)="submit()" [disabled]="isLoading">SUBMIT</button>
                    <button class="btn btn-flat wide" (click)="backToLogin()">
                        <i class="fa fa-sign-in"></i>Back to Login Page
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
