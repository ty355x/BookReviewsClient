<div class="form-pane-container">

    <div *ngIf="view === 'error'" class="form-pane">
        <h1>Change Password</h1>
        <div class="fail">{{ error }}</div>
    </div>

    <div *ngIf="view === 'verifying'" class="form-pane verifying">
        <h1>Change Password</h1>
        <div class="loading">
            <app-loading></app-loading>
        </div>
    </div>

    <div *ngIf="view === 'reset'" class="form-pane">
        <h1>Change Password</h1>

        <form class="form">

            <div class="form-field">
                <label>New Password</label>
                <input name="newPassword" type="password" class="textbox" [(ngModel)]="newPassword" [disabled]="isLoading">
            </div>

            <div class="form-field">
                <label>Confirm New Password</label>
                <input name="newPasswordConfirm" type="password" class="textbox" [(ngModel)]="newPasswordConfirm" [disabled]="isLoading">
            </div>

            <div *ngIf="error" class="error-message">
                {{ error }}
            </div>

            <div class="form-footer">
                <button type="submit" class="btn" (click)="resetPassword()" [disabled]="isLoading">CHANGE PASSWORD</button>
            </div>
        </form>
    </div>

    <div *ngIf="view === 'success'" class="form-pane">
        <h1>Change Password Success</h1>
        <p style="margin-top: 32px">Your password has been changed. You may now log in with your new password.</p>
        <button class="btn btn-flat" style="margin-top: 12px" (click)="login()"><i class="fa fa-sign-in"></i>Log In</button>
    </div>

</div>
