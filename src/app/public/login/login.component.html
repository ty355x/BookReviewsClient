<div class="page-wrapper">
    <div class="pane">

        <h1>BookReviews Login</h1>

        <form style="width: 260px">
            <div class="form-field">
                <label>Email</label>
                <input id="email" name="email" type="text" class="textbox" [(ngModel)]="credentials.email" [disabled]="isLoading">
            </div>

            <div class="form-field">
                <label>Password</label>
                <input id="password" name="password" type="password" class="textbox" [(ngModel)]="credentials.password" [disabled]="isLoading">
            </div>

            <div *ngIf="error" class="form-error" style="margin-bottom: -24px;">
                {{ error }}
            </div>

            <div class="form-footer" style="margin-top: 48px;">
                <button type="submit" class="btn btn-form wide" (click)="login()" [disabled]="isLoading">LOG IN</button>
                <button class="btn btn-flat wide" (click)="resetPassword()">
                    <i class="fa fa-lock"></i>Password Recovery
                </button>
            </div>
        </form>
    </div>
</div>
